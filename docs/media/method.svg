<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1c262c">
<rect width="1000" height="664" rx="10" fill="#faf9f6"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a656b"/></marker></defs>
<rect x="20" y="20" width="318" height="112" rx="8" fill="#fff" stroke="#dcd9d2"/>
<circle cx="44" cy="44" r="12" fill="#1c262c"/><text x="44" y="49" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<text x="66" y="49" font-size="15" font-weight="700">Raw observations</text>
<text x="34" y="74" fill="#5a656b">USGS seismic signal, Gyirong Port camera, DHM ten-</text>
<text x="34" y="91" fill="#5a656b">minute gauge records, UNOSAT and Copernicus EMS</text>
<text x="34" y="108" fill="#5a656b">satellite mapping, OSM river network, GLO-30 DEM.</text>
<line x1="179.0" y1="134" x2="179.0" y2="144" stroke="#5a656b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="148" width="318" height="112" rx="8" fill="#fff" stroke="#dcd9d2"/>
<circle cx="44" cy="172" r="12" fill="#1c262c"/><text x="44" y="177" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<text x="66" y="177" font-size="15" font-weight="700">Evidence anchors</text>
<text x="34" y="202" fill="#5a656b">8 time windows placed on a 203 km river route,</text>
<text x="34" y="219" fill="#5a656b">each classed as observed, reported, inferred or</text>
<text x="34" y="236" fill="#5a656b">assumed. 2 further reports are kept back as checks</text>
<text x="34" y="253" fill="#5a656b">and never fitted.</text>
<line x1="179.0" y1="262" x2="179.0" y2="272" stroke="#5a656b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="276" width="318" height="112" rx="8" fill="#fff" stroke="#dcd9d2"/>
<circle cx="44" cy="300" r="12" fill="#1c262c"/><text x="44" y="305" text-anchor="middle" fill="#fff" font-weight="700">3</text>
<text x="66" y="305" font-size="15" font-weight="700">Temporal interpolation</text>
<text x="34" y="330" fill="#5a656b">Window midpoints are interpolated piecewise-</text>
<text x="34" y="347" fill="#5a656b">linearly against route distance, giving an arrival</text>
<text x="34" y="364" fill="#5a656b">minute at every 40 m route point.</text>
<line x1="179.0" y1="390" x2="179.0" y2="400" stroke="#5a656b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="404" width="318" height="112" rx="8" fill="#fff" stroke="#dcd9d2"/>
<circle cx="44" cy="428" r="12" fill="#1c262c"/><text x="44" y="433" text-anchor="middle" fill="#fff" font-weight="700">4</text>
<text x="66" y="433" font-size="15" font-weight="700">Uncertainty</text>
<text x="34" y="458" fill="#5a656b">Interpolating the earliest and latest bounds in</text>
<text x="34" y="475" fill="#5a656b">the same way gives a scenario envelope. It is not</text>
<text x="34" y="492" fill="#5a656b">a statistical confidence interval.</text>
<line x1="179.0" y1="518" x2="179.0" y2="528" stroke="#5a656b" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="532" width="318" height="112" rx="8" fill="#fff" stroke="#dcd9d2"/>
<circle cx="44" cy="556" r="12" fill="#1c262c"/><text x="44" y="561" text-anchor="middle" fill="#fff" font-weight="700">5</text>
<text x="66" y="561" font-size="15" font-weight="700">3D visualisation</text>
<text x="34" y="586" fill="#5a656b">Each pixel (about 34 m) of the satellite-mapped</text>
<text x="34" y="603" fill="#5a656b">extent takes the minute of its nearest route point</text>
<text x="34" y="620" fill="#5a656b">and is revealed at that time on 3D terrain.</text>
<text x="420" y="28" font-size="15" font-weight="700">Stages 2 to 4, drawn from the project's data</text>
<line x1="420" x2="975" y1="600.0" y2="600.0" stroke="#dcd9d2"/><text x="412" y="604.0" text-anchor="end" fill="#5a656b">0</text>
<line x1="420" x2="975" y1="467.6" y2="467.6" stroke="#dcd9d2"/><text x="412" y="471.6" text-anchor="end" fill="#5a656b">50</text>
<line x1="420" x2="975" y1="335.2" y2="335.2" stroke="#dcd9d2"/><text x="412" y="339.2" text-anchor="end" fill="#5a656b">100</text>
<line x1="420" x2="975" y1="202.9" y2="202.9" stroke="#dcd9d2"/><text x="412" y="206.9" text-anchor="end" fill="#5a656b">150</text>
<line x1="420" x2="975" y1="70.5" y2="70.5" stroke="#dcd9d2"/><text x="412" y="74.5" text-anchor="end" fill="#5a656b">200</text>
<line x1="452.7" x2="452.7" y1="600" y2="605" stroke="#5a656b"/><text x="452.7" y="620" text-anchor="middle" fill="#5a656b">09:00</text>
<line x1="538.1" x2="538.1" y1="600" y2="605" stroke="#5a656b"/><text x="538.1" y="620" text-anchor="middle" fill="#5a656b">10:00</text>
<line x1="623.5" x2="623.5" y1="600" y2="605" stroke="#5a656b"/><text x="623.5" y="620" text-anchor="middle" fill="#5a656b">11:00</text>
<line x1="708.9" x2="708.9" y1="600" y2="605" stroke="#5a656b"/><text x="708.9" y="620" text-anchor="middle" fill="#5a656b">12:00</text>
<line x1="794.3" x2="794.3" y1="600" y2="605" stroke="#5a656b"/><text x="794.3" y="620" text-anchor="middle" fill="#5a656b">13:00</text>
<line x1="879.7" x2="879.7" y1="600" y2="605" stroke="#5a656b"/><text x="879.7" y="620" text-anchor="middle" fill="#5a656b">14:00</text>
<line x1="965.0" x2="965.0" y1="600" y2="605" stroke="#5a656b"/><text x="965.0" y="620" text-anchor="middle" fill="#5a656b">15:00</text>
