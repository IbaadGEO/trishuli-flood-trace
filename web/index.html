<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trishuli Flood Trace</title>
<meta name="description" content="Interactive 3D reconstruction of the 26 August 2026 Nepal–Tibet debris flow down the Trishuli river, built from satellite mapping, river-gauge records and official reports.">
<meta property="og:type" content="website">
<meta property="og:title" content="Trishuli Flood Trace">
<meta property="og:description" content="How the 26 August 2026 debris flow travelled ~200 km from the Lirung massif to Devghat: observed flood extent, gauge records and timeline.">
<meta property="og:url" content="https://trishuli-flood-trace.vercel.app/">
<meta property="og:image" content="https://trishuli-flood-trace.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="3D map of the Trishuli river with hourly positions of the 26 August 2026 flood front reaching Devghat">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#14212b">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><b>Trishuli Flood Trace</b><span>26 Aug 2026 · Rasuwa → Devghat</span></div>
  <div class="hdr-right">
    <div class="seg" id="views" role="group" aria-label="Map view">
      <button data-view="story" class="on" title="The flood unfolding: front, path and timing">Story</button>
      <button data-view="damage" title="Mapped damage: buildings, roads, final extent">Damage</button>
      <button data-view="imagery" title="Before/after satellite imagery">Imagery</button>
      <button data-view="all" title="Every layer">All</button>
    </div>
    <button id="follow" class="on" aria-pressed="true" title="Camera follows the flow front during playback">◎ Follow front</button>
    <div class="seg" id="dim"><button data-v="2">2D</button><button data-v="3" class="on">3D</button></div>
    <span class="pill">Reconstruction · not live</span>
  </div>
</header>

<main id="map" aria-label="3D map of the Trishuli river corridor"></main>

<aside id="side">
  <nav class="tabs"><button data-tab="overview" class="on">Incident</button><button data-tab="layers">Layers</button></nav>
  <section id="overview" class="tab on"></section>
  <section id="layers" class="tab"></section>
</aside>

<section id="bottom">
  <div class="tl">
    <button id="restart" aria-label="Restart">⏮</button>
    <button id="play" aria-label="Play">▶</button>
    <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    <div class="clock"><b id="clock">08:37 NPT</b><span id="clock-sub">collapse</span></div>
    <div class="track"><input id="t" type="range" min="0" max="600" step="1" value="0" aria-label="Time after collapse"><div id="ticks"></div></div>
  </div>
  <div class="charts">
    <figure><figcaption>Flow front distance <em>observed ● · interpolated —</em></figcaption><svg id="c-front"></svg></figure>
    <figure><figcaption>River long profile <em>bed elevation, km from source</em></figcaption><svg id="c-profile"></svg></figure>
    <figure><figcaption>Flood extent reached <em>observed area, est. timing, ha</em></figcaption><svg id="c-area"></svg></figure>
  </div>
</section>

<aside id="events"><h3>Key events <span>26 Aug, NPT</span></h3><ol id="ev"></ol></aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
